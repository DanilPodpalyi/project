[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-evaluator"
version = "0.2.0"
description = "Оценка резюме и рекомендации по выборке вакансий России"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama==0.6.2", "pydantic==2.13.4", "pypdf==6.16.1",
  "python-docx==1.2.0", "pymorphy3==2.0.6", "httpx==0.28.1",
]

[project.scripts]
resume-evaluator = "resume_evaluator.cli:main"

[tool.setuptools.packages.find]
include = ["resume_evaluator*"]
